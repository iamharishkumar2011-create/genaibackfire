<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Writing Assistant</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── HELPERS ──────────────────────────────────────────────────────────────────
    // API key is now entered at runtime via the UI (OpenRouter key)
    let API_KEY = "";

    async function callLLM(messages, temperature = 0.7) {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: "anthropic/claude-sonnet-4-20250514",
          messages: messages,
          temperature: temperature,
        })
      });
      if (!response.ok) {
        throw new Error("API Request Failed");
      }
      const data = await response.json();
      return data.choices[0].message.content;
    }

    // ── UI COMPONENTS ────────────────────────────────────────────────────────────
    function ProgressBar({ step, total }) {
      const pct = Math.round((step / total) * 100);
      return (
        <div className="mb-8">
          <div className="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>Step {step} of {total}</span>
            <span>{pct}%</span>
          </div>
          <div className="h-0.5 bg-gray-100 rounded-full">
            <div className="h-0.5 bg-gray-700 rounded-full transition-all duration-500" style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function Btn({ onClick, disabled, children, outline }) {
      const base = "px-5 py-2 rounded text-sm font-medium transition-all duration-150 ";
      const style = disabled
        ? "bg-gray-100 text-gray-400 cursor-not-allowed"
        : outline
        ? "border border-gray-300 text-gray-600 hover:bg-gray-50"
        : "bg-gray-900 text-white hover:bg-gray-700 active:scale-95";
      return <button onClick={onClick} disabled={disabled} className={base + style}>{children}</button>;
    }

    const Shell = ({ children, step, total = 3 }) => (
      <div className="min-h-screen bg-gray-50 flex justify-center pt-10 pb-16 px-4">
        <div className="w-full" style={{ maxWidth: 600 }}>
          {step > 0 && <ProgressBar step={step} total={total} />}
          {children}
        </div>
      </div>
    );

    // ── MAIN ─────────────────────────────────────────────────────────────────────
    function Study1Platform() {
      const [phase, setPhase] = useState('welcome');
      const [cond, setCond] = useState(null);
      
      const [apiKey, setApiKey] = useState('');
      const [keyFromUrl, setKeyFromUrl] = useState(false);
      const [prompt, setPrompt] = useState('');
      const [baselineStory, setBaselineStory] = useState('');
      const [options, setOptions] = useState([]);
      const [selectedOption, setSelectedOption] = useState(null);
      const [finalStory, setFinalStory] = useState('');
      const [loadingMsg, setLoadingMsg] = useState('');

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);

        // Read API key from URL: ?key=sk-proj-...
        const urlKey = params.get('key') || '';
        if (urlKey) {
          setApiKey(urlKey);
          setKeyFromUrl(true);
          API_KEY = urlKey;
        }

        // Allow forcing condition via URL: ?cond=hh (high quality, high engage)
        // hh = High/High, hl = High/Low, mh = Low/High, ml = Low/Low
        const condParam = params.get('cond');
        if (condParam && condParam.length === 2) {
          const q = condParam[0]; // 'h' or 'm'
          const e = condParam[1] === 'h' ? 'high' : 'low';
          setCond({ q, e });
        } else {
          // Randomize 2x2: Quality (h/m) x Engagement (high/low)
          const q = Math.random() < 0.5 ? 'h' : 'm';
          const e = Math.random() < 0.5 ? 'high' : 'low';
          setCond({ q, e });
        }
      }, []);

      const getSystemPrompt = () => {
        if (cond.q === 'h') {
          return `You are an award-winning literary fiction author. Your writing MUST demonstrate:
- Rich metaphors and original figurative language (never use clichés)
- Varied sentence structure: mix short punchy sentences with flowing complex ones
- Vivid sensory details across all five senses
- Show-don't-tell: reveal emotions through actions, body language, and environment
- Subtext and layered meaning beneath the surface narrative
- A distinctive, compelling narrative voice
- Strong opening hooks and resonant endings
Write prose that would be published in a top literary magazine.`;
        } else {
          return `You are a below-average writer with limited skill. Your writing MUST demonstrate:
- Only literal, surface-level descriptions with no figurative language
- Repetitive sentence patterns: almost every sentence should start with "He" or "She" or "It" or "The"
- Tell emotions directly: say "He was sad" or "She felt happy" instead of showing
- Use common clichés freely: "it was a dark and stormy night", "her heart skipped a beat", etc.
- No sensory details beyond basic sight
- Simple vocabulary only — no words above a 6th grade reading level
- Flat, predictable pacing with no variation in rhythm
Write prose that feels like an amateur's first draft.`;
        }
      };

      // Use different temperatures: higher for creative high-quality, lower for flat low-quality
      const getTemperature = () => cond.q === 'h' ? 0.9 : 0.3;

      const handleGenerateLow = async () => {
        setPhase('loading');
        setLoadingMsg('Generating your story...');
        try {
          const messages = [
            { role: "system", content: getSystemPrompt() },
            { role: "user", content: `Write a short story based on this idea: ${prompt}. Keep it around 200-300 words.` }
          ];
          const story = await callLLM(messages, getTemperature());
          setFinalStory(story);
          setPhase('story');
        } catch (err) {
          alert("Error generating story. Please check your API key.");
          setPhase('task_low');
        }
      };

      const handleGenerateHighBase = async () => {
        setPhase('loading');
        setLoadingMsg('Drafting a baseline story...');
        try {
          // 1. Generate baseline
          const baseMsgs = [
            { role: "system", content: getSystemPrompt() },
            { role: "user", content: `Write a short baseline draft of a story based on this idea: ${prompt}. Keep it around 150 words.` }
          ];
          const baseline = await callLLM(baseMsgs, getTemperature());
          setBaselineStory(baseline);

          // 2. Generate 3 options for direction
          setLoadingMsg('Generating creative directions...');
          const optMsgs = [
            { role: "system", content: "You are an assistant helping a writer brainstorm. Give exactly 3 distinct, creative directions or twists to take this story. Format as a simple numbered list (1., 2., 3.). Do not include introductory text." },
            { role: "user", content: `Here is the baseline story: "${baseline}". Give me 3 creative ways to develop or change this story.` }
          ];
          const optsText = await callLLM(optMsgs);
          const parsedOpts = optsText.split(/\n/).filter(l => l.trim().match(/^\d/)).map(l => l.replace(/^\d+\.\s*/, '').trim());
          setOptions(parsedOpts.slice(0, 3));
          
          setPhase('engage_choice');
        } catch (err) {
          alert("Error generating baseline. Please check your API key.");
          setPhase('task_high');
        }
      };

      const handleGenerateHighFinal = async () => {
        setPhase('loading');
        setLoadingMsg('Writing final story incorporating your choice...');
        try {
          const finalMsgs = [
            { role: "system", content: getSystemPrompt() },
            { role: "user", content: `Here is a baseline story: "${baselineStory}". Please rewrite and expand this story (to around 250-300 words) by incorporating this specific creative direction: "${selectedOption}". Make sure it flows naturally.` }
          ];
          const final = await callLLM(finalMsgs, getTemperature());
          setFinalStory(final);
          setPhase('story');
        } catch (err) {
          alert("Error generating final story. Please check your API key.");
          setPhase('engage_choice');
        }
      };

      if (!cond) return null;

      // ── WELCOME ─────────────────────────────────────────────────────────────────
      const handleStart = () => {
        API_KEY = apiKey;
        setPhase(cond.e === 'high' ? 'task_high' : 'task_low');
      };

      if (phase === 'welcome') return (
        <Shell step={0} total={3}>
          <h1 className="text-2xl font-semibold text-gray-900 mb-3">AI Writing Assistant</h1>

          <p className="text-sm text-gray-600 mb-6 leading-relaxed">
            Welcome! You will use our AI tool to collaboratively write a short story. Please follow the instructions on the next screen.
          </p>

          {/* Only show key input if key was NOT provided via URL */}
          {!keyFromUrl && (
            <div className="bg-white border border-gray-200 rounded-lg p-5 mb-6 shadow-sm">
              <p className="text-sm font-medium text-gray-800 mb-2">Researcher: Enter API Key</p>
              <input
                type="password"
                className="w-full border border-gray-200 rounded-lg p-3 text-sm text-gray-800 outline-none focus:ring-1 focus:ring-gray-400 bg-white"
                placeholder="sk-or-v1-..."
                value={apiKey}
                onChange={e => setApiKey(e.target.value)}
              />
              <p className="text-xs text-gray-400 mt-1">Paste your OpenRouter key for testing.</p>
            </div>
          )}

          <Btn onClick={handleStart} disabled={apiKey.length < 10}>Start Task →</Btn>
        </Shell>
      );

      // ── LOW ENGAGEMENT TASK ─────────────────────────────────────────────────────
      if (phase === 'task_low') return (
        <Shell step={1} total={2}>
          <h2 className="text-xl font-semibold text-gray-900 mb-2">Your Writing Task</h2>
          <p className="text-sm text-gray-600 mb-6">Simply describe what you would like the story to be about, then submit your request.</p>
          <textarea
            rows={4}
            className="w-full border border-gray-200 rounded-lg p-4 text-sm text-gray-800 resize-none outline-none focus:ring-1 focus:ring-gray-400 shadow-sm bg-white"
            placeholder="Describe your story idea..."
            value={prompt}
            onChange={e => setPrompt(e.target.value)}
          />
          <div className="mt-6 flex justify-end">
            <Btn onClick={handleGenerateLow} disabled={prompt.length < 5}>Generate Story →</Btn>
          </div>
        </Shell>
      );

      // ── HIGH ENGAGEMENT TASK ────────────────────────────────────────────────────
      if (phase === 'task_high') return (
        <Shell step={1} total={3}>
          <h2 className="text-xl font-semibold text-gray-900 mb-2">Your Writing Task</h2>
          <p className="text-sm text-gray-600 mb-6">Provide an initial idea. The AI will write a baseline draft and then ask for your creative direction.</p>
          <textarea
            rows={4}
            className="w-full border border-gray-200 rounded-lg p-4 text-sm text-gray-800 resize-none outline-none focus:ring-1 focus:ring-gray-400 shadow-sm bg-white"
            placeholder="Describe your story idea..."
            value={prompt}
            onChange={e => setPrompt(e.target.value)}
          />
          <div className="mt-6 flex justify-end">
            <Btn onClick={handleGenerateHighBase} disabled={prompt.length < 5}>Generate Draft →</Btn>
          </div>
        </Shell>
      );

      // ── HIGH ENGAGEMENT: CHOICES ────────────────────────────────────────────────
      if (phase === 'engage_choice') return (
        <Shell step={2} total={3}>
          <h2 className="text-xl font-semibold text-gray-900 mb-2">Co-Creation Step</h2>
          <p className="text-sm text-gray-600 mb-4">Here is the baseline story the AI drafted:</p>
          <div className="bg-white border border-gray-200 rounded-lg p-5 text-sm text-gray-800 mb-8 whitespace-pre-line shadow-sm">
            {baselineStory}
          </div>
          
          <p className="text-base font-medium text-gray-900 mb-4">How would you like to develop it? Select a direction:</p>
          <div className="space-y-3 mb-8">
            {options.map((opt, i) => (
              <label key={i} className={`block border rounded-lg p-4 cursor-pointer transition-colors ${selectedOption === opt ? 'border-gray-800 bg-gray-100 shadow-inner' : 'border-gray-200 bg-white hover:border-gray-300 shadow-sm'}`}>
                <div className="flex items-start gap-3">
                  <input type="radio" name="direction" value={opt} checked={selectedOption === opt} onChange={() => setSelectedOption(opt)} className="mt-1" />
                  <span className="text-sm text-gray-800 leading-snug">{opt}</span>
                </div>
              </label>
            ))}
          </div>
          
          <div className="flex justify-end">
            <Btn onClick={handleGenerateHighFinal} disabled={!selectedOption}>Generate Final Story →</Btn>
          </div>
        </Shell>
      );

      // ── LOADING ─────────────────────────────────────────────────────────────────
      if (phase === 'loading') return (
        <div className="min-h-screen bg-gray-50 flex items-center justify-center">
          <div className="text-center">
            <div className="w-8 h-8 rounded-full border-2 border-gray-200 border-t-gray-800 animate-spin mx-auto mb-4" />
            <p className="text-sm font-medium text-gray-600">{loadingMsg}</p>
          </div>
        </div>
      );

      // ── STORY DISPLAY ───────────────────────────────────────────────────────────
      if (phase === 'story') return (
        <Shell step={cond.e === 'high' ? 3 : 2} total={cond.e === 'high' ? 3 : 2}>
          <div className="flex justify-between items-center mb-4">
            <h2 className="text-xl font-semibold text-gray-900">Final Story Stimulus</h2>
            <Btn outline onClick={() => { setPhase('welcome'); setPrompt(''); setBaselineStory(''); setOptions([]); setSelectedOption(null); setFinalStory(''); }}>Start Over</Btn>
          </div>
          <div className="rounded-lg border border-gray-200 bg-white p-6 mb-6 shadow-sm">
            <p className="text-base text-gray-800 leading-relaxed whitespace-pre-line">{finalStory}</p>
          </div>
          <div className="bg-white border border-gray-200 shadow-sm rounded-lg p-5 text-sm text-gray-600 space-y-2">
            <p><strong>Condition:</strong> {cond.q === 'h' ? 'High' : 'Low'} Quality / {cond.e === 'high' ? 'High' : 'Low'} Engagement</p>
            <p><strong>Prompt:</strong> {prompt}</p>
            {cond.e === 'high' && <p><strong>Chosen Direction:</strong> {selectedOption}</p>}
          </div>
        </Shell>
      );

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Study1Platform />);
  </script>
</body>
</html>
